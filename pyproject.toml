[build-system]
requires = ["meson~=1.3", "meson-python", "ninja==1.*", "numpy==2.*", "torch~=2.10"]
build-backend = "mesonpy"

[project]
name = "add-pi"
dynamic = ["version"]
description = "Adds Pi"
requires-python = "~=3.12"
authors = [
    {name = "Mason Davy", email = "masonnosam11@gmail.com"}
]
dependencies = [
    "numpy==2.*",
    "torch~=2.10",
]

[dependency-groups]
base = ["numpy==2.*", "torch~=2.10"]
build = ["meson~=1.3", "meson-python", "ninja==1.*", {include-group = "base"}]
test = ["pytest", {include-group = "base"}]
all = [{include-group = "base"}, {include-group = "build"}, {include-group = "test"}]

[tool.meson-python]
editable-verbose = true
limited-api = true
